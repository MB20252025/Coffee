<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jug · Coffee Fill & Pour</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #2b2520;
            background-image: radial-gradient(circle at 20% 30%, #3f352e 5%, #1f1a15 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: rgba(30, 25, 20, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px 40px 30px 30px;
            padding: 25px 30px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px #b48d64;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 700px;
            width: 100%;
        }
        h1 {
            font-weight: 400;
            color: #fad7a8;
            text-shadow: 0 2px 8px #2d1f13;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .sub {
            color: #dbbc93;
            background: #1f1a15b8;
            padding: 4px 22px;
            border-radius: 40px;
            border: 1px solid #b48d64;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 60vh;
            border-radius: 20px;
            background: #1e1813;
            box-shadow: inset 0 0 30px #0a0705, 0 8px 20px black;
            border: 2px solid #b48d64;
            touch-action: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 8px;
        }
        button {
            padding: 8px 28px;
            font-size: 1rem;
            font-weight: 600;
            background: #4f3a28;
            border: 2px solid #cbab82;
            color: #f7e9d3;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #2b1d12;
            letter-spacing: 0.5px;
            flex: 1 1 auto;
            min-width: 110px;
        }
        button:hover {
            background: #73583e;
            border-color: #f5cf9e;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #2b1d12;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2b1d12;
        }
        .status {
            font-size: 1.1rem;
            background: #1f1a15b8;
            padding: 4px 24px;
            border-radius: 30px;
            border: 1px solid #b48d64;
            color: #f0dcc0;
            margin-top: 6px;
        }
        .note {
            font-style: italic;
            color: #cfa97c;
            font-size: 0.7rem;
            margin-top: 6px;
            opacity: 0.7;
        }
        /* mobile */
        @media (max-width: 480px) {
            .card { padding: 15px; }
            h1 { font-size: 1.6rem; }
            button { min-width: 80px; padding: 6px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>☕ The Coffee Jug</h1>
    <div class="sub">fill · pour · watch it flow</div>

    <canvas id="jugCanvas"></canvas>

    <div class="controls">
        <button id="fillBtn">⬆ Fill</button>
        <button id="pourBtn">⬇ Pour</button>
        <button id="resetBtn">⟲ Reset</button>
    </div>

    <div class="status" id="statusDisplay">Level: 0%</div>
    <div class="note">– coffee moves with smooth physics –</div>
</div>

<script>
    (function() {
        // ============================================================
        //  CONFIG – adjust these to match your jug.png
        // ============================================================
        const IMAGE_PATH = 'jug.png';          // your photo
        const SPOUT_X = 0.08;                 // % of canvas width  (0=left, 1=right)
        const SPOUT_Y = 0.02;                 // % of canvas height (0=top)
        const ANIMATION_DURATION = 800;       // ms for fill/pour
        const MAX_LEVEL = 0.85;               // how high coffee goes (0–1)

        // ============================================================
        //  DOM refs
        // ============================================================
        const canvas = document.getElementById('jugCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('statusDisplay');

        // ============================================================
        //  State
        // ============================================================
        let currentLevel = 0;          // 0 … MAX_LEVEL
        let targetLevel = 0;
        let isAnimating = false;
        let isPouring = false;         // show stream?
        let img = null;

        // ============================================================
        //  Load image & setup canvas
        // ============================================================
        function initCanvas() {
            img = new Image();
            img.onload = function() {
                // size canvas to image
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.aspectRatio = img.width / img.height;
                // start with empty jug
                currentLevel = 0;
                targetLevel = 0;
                isPouring = false;
                drawScene();
            };
            img.onerror = function() {
                alert('Could not load ' + IMAGE_PATH + '.\nMake sure the file is in the same folder.');
            };
            img.src = IMAGE_PATH;
        }

        // ============================================================
        //  Drawing engine
        // ============================================================
        function drawScene(level = currentLevel, pouring = isPouring) {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            if (!img) return;

            // ----------------------------------------------------------
            //  1. Draw the jug as a "mask" (destination)
            // ----------------------------------------------------------
            ctx.drawImage(img, 0, 0, w, h);

            // ----------------------------------------------------------
            //  2. Draw coffee ONLY inside the transparent area
            //     using 'source-out'
            // ----------------------------------------------------------
            const liquidHeight = level * h;
            if (liquidHeight > 0) {
                // Save context and set composite mode
                ctx.save();
                ctx.globalCompositeOperation = 'source-out';

                // coffee gradient
                const grad = ctx.createLinearGradient(0, h - liquidHeight, 0, h);
                grad.addColorStop(0, '#8b5d37');
                grad.addColorStop(0.4, '#6b3e1f');
                grad.addColorStop(0.8, '#4d2c15');
                grad.addColorStop(1, '#2f1a0c');
                ctx.fillStyle = grad;

                // draw the liquid rectangle from bottom up
                ctx.fillRect(0, h - liquidHeight, w, liquidHeight);

                // add a glossy highlight on top of the liquid
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                const highlightY = h - liquidHeight;
                ctx.ellipse(w * 0.3, highlightY + 2, w * 0.25, 4, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 220, 170, 0.25)';
                ctx.fill();

                ctx.restore();
            }

            // ----------------------------------------------------------
            //  3. Overdraw the jug (so outline, handle, spout appear ON TOP)
            // ----------------------------------------------------------
            ctx.drawImage(img, 0, 0, w, h);

            // ----------------------------------------------------------
            //  4. Pouring stream (if active)
            // ----------------------------------------------------------
            if (pouring && level > 0.02) {
                drawStream(w, h, level);
            }

            // update status
            const percent = Math.round((level / MAX_LEVEL) * 100);
            statusEl.textContent = `Level: ${Math.min(percent, 100)}%`;
        }

        // ============================================================
        //  Stream effect
        // ============================================================
        function drawStream(w, h, level) {
            // spout position (in pixels)
            const sx = SPOUT_X * w;
            const sy = SPOUT_Y * h;

            // stream length depends on level – more coffee = longer pour
            const baseLength = Math.min(level / MAX_LEVEL, 1) * h * 0.7 + 30;
            const time = Date.now() / 300;

            // start from spout, wiggle slightly
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 12;

            // main stream – a tapered polygon
            ctx.beginPath();
            const topWidth = 8 + Math.sin(time * 1.3) * 1.5;
            const bottomWidth = 3 + Math.sin(time * 1.7 + 1) * 1.2;
            const wiggle = Math.sin(time * 2.1) * 4;

            // top of stream (at spout)
            ctx.moveTo(sx - topWidth / 2 + wiggle * 0.3, sy + 4);
            ctx.quadraticCurveTo(
                sx + wiggle * 0.6,
                sy + baseLength * 0.4,
                sx - bottomWidth / 2 + wiggle * 0.8,
                sy + baseLength
            );
            ctx.quadraticCurveTo(
                sx + wiggle * 0.3 + 2,
                sy + baseLength * 0.6,
                sx + topWidth / 2 + wiggle * 0.4,
                sy + 4
            );
            ctx.closePath();

            // gradient for the stream
            const grad = ctx.createLinearGradient(sx, sy, sx + wiggle, sy + baseLength);
            grad.addColorStop(0, '#a06b42');
            grad.addColorStop(0.5, '#6b3e1f');
            grad.addColorStop(1, '#3d2413');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;

            // droplets at the bottom
            for (let i = 0; i < 6; i++) {
                const dx = (i - 2.5) * 5 + Math.sin(time * 2.7 + i) * 3;
                const dy = Math.sin(time * 3.1 + i * 0.7) * 2;
                const radius = 2 + Math.sin(time * 2.3 + i * 1.1) * 1.2 + 1.5;
                ctx.beginPath();
                ctx.arc(
                    sx + wiggle * 0.6 + dx,
                    sy + baseLength + 6 + dy + i * 2,
                    Math.max(radius, 1),
                    0, Math.PI * 2
                );
                ctx.fillStyle = `rgba(100, 60, 35, ${0.5 + Math.sin(time + i) * 0.2})`;
                ctx.fill();
            }

            ctx.restore();
        }

        // ============================================================
        //  Smooth animation (tween)
        // ============================================================
        function animateTo(target, callback) {
            if (isAnimating) return;
            const start = currentLevel;
            const end = Math.min(Math.max(target, 0), MAX_LEVEL);
            if (Math.abs(start - end) < 0.001) {
                currentLevel = end;
                drawScene();
                if (callback) callback();
                return;
            }

            isAnimating = true;
            const startTime = performance.now();

            function step(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / ANIMATION_DURATION, 1);
                // ease in-out cubic
                const eased = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                currentLevel = start + (end - start) * eased;
                drawScene(currentLevel, isPouring);

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    currentLevel = end;
                    isAnimating = false;
                    drawScene(currentLevel, isPouring);
                    if (callback) callback();
                }
            }
            requestAnimationFrame(step);
        }

        // ============================================================
        //  Actions
        // ============================================================
        function fillCoffee() {
            if (isAnimating) return;
            // if already full, do nothing
            if (currentLevel >= MAX_LEVEL - 0.01) return;
            isPouring = false;
            animateTo(MAX_LEVEL);
        }

        function pourCoffee() {
            if (isAnimating) return;
            if (currentLevel < 0.02) return; // nothing to pour
            isPouring = true;
            // pour all the way down
            animateTo(0, function() {
                isPouring = false;
                drawScene(0, false);
            });
        }

        function resetJug() {
            if (isAnimating) return;
            isPouring = false;
            currentLevel = 0;
            targetLevel = 0;
            drawScene(0, false);
        }

        // ============================================================
        //  Wire up UI
        // ============================================================
        document.getElementById('fillBtn').addEventListener('click', fillCoffee);
        document.getElementById('pourBtn').addEventListener('click', pourCoffee);
        document.getElementById('resetBtn').addEventListener('click', resetJug);

        // ============================================================
        //  Start
        // ============================================================
        initCanvas();

        // ============================================================
        //  Handle window resize (re-draw)
        // ============================================================
        window.addEventListener('resize', function() {
            if (img) drawScene(currentLevel, isPouring);
        });

        // Expose for debugging (optional)
        window.__jug = { fill: fillCoffee, pour: pourCoffee, reset: resetJug };

    })();
</script>
</body>
</html>
